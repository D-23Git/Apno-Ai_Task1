<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="150" r="180" fill="#6366f1" opacity="0.18" filter="url(#glow)" />
  <circle cx="1000" cy="450" r="220" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" />

  <!-- Top Decorative Badge -->
  <g transform="translate(60, 50)">
    <rect width="250" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="18" r="5" fill="#10b981" />
    <text x="35" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
      ApnoAI Internship • Task 1
    </text>
  </g>

  <!-- Main Title & Tagline -->
  <g transform="translate(60, 130)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#f8fafc">
      Dnyaneshwari's Web Portfolio
    </text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
      Semantic HTML5 • CSS Flexbox Layouts • Dark-Mode Toggle (+10 XP Bonus)
    </text>
  </g>

  <!-- Browser Window Mockup -->
  <g transform="translate(60, 210)">
    <!-- Window Container -->
    <rect width="1080" height="370" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Window Header -->
    <rect width="1080" height="48" rx="16" fill="#1e293b" />
    <rect y="32" width="1080" height="16" fill="#1e293b" />
    <line x1="0" y1="48" x2="1080" y2="48" stroke="#334155" stroke-width="1" />

    <!-- Traffic Lights -->
    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" />
    <circle cx="68" cy="24" r="6" fill="#10b981" />

    <!-- URL Bar -->
    <rect x="110" y="10" width="480" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="130" y="29" font-family="monospace" font-size="12" fill="#94a3b8">https://apno-ai-task1-dnyaneshwari.vercel.app</text>

    <!-- Theme Toggle Indicator -->
    <g transform="translate(980, 12)">
      <rect width="70" height="24" rx="12" fill="#334155" />
      <text x="12" y="17" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">🌙 Dark</text>
    </g>

    <!-- Mockup Inner Content (4 Sections Preview) -->
    <!-- Nav Mock -->
    <g transform="translate(30, 70)">
      <text x="0" y="18" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">Dnyaneshwari<tspan fill="#6366f1">.</tspan></text>
      <text x="740" y="18" font-family="sans-serif" font-size="13" fill="#cbd5e1">Home    About    Services    Contact</text>
    </g>

    <line x1="30" y1="105" x2="1050" y2="105" stroke="#334155" stroke-width="1" stroke-dasharray="4" />

    <!-- 4 Section Cards Grid -->
    <g transform="translate(30, 130)">
      <!-- Card 1: Home / Hero -->
      <g transform="translate(0, 0)">
        <rect width="235" height="190" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <rect x="15" y="15" width="60" height="20" rx="10" fill="#6366f1" opacity="0.2" />
        <text x="24" y="29" font-family="sans-serif" font-size="10" font-weight="bold" fill="#818cf8">SECTION 1</text>
        <text x="15" y="65" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">Home / Hero</text>
        <text x="15" y="90" font-family="sans-serif" font-size="12" fill="#94a3b8">Live Typing Effect</text>
        <text x="15" y="110" font-family="sans-serif" font-size="12" fill="#94a3b8">Interactive Code Card</text>
        <text x="15" y="130" font-family="sans-serif" font-size="12" fill="#94a3b8">Availability Badge</text>
        <rect x="15" y="150" width="100" height="24" rx="12" fill="url(#accentGrad)" />
        <text x="32" y="166" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Explore Work</text>
      </g>

      <!-- Card 2: About -->
      <g transform="translate(260, 0)">
        <rect width="235" height="190" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <rect x="15" y="15" width="60" height="20" rx="10" fill="#8b5cf6" opacity="0.2" />
        <text x="24" y="29" font-family="sans-serif" font-size="10" font-weight="bold" fill="#a78bfa">SECTION 2</text>
        <text x="15" y="65" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">About Me</text>
        <text x="15" y="90" font-family="sans-serif" font-size="12" fill="#94a3b8">Skills Progress Bars</text>
        <text x="15" y="110" font-family="sans-serif" font-size="12" fill="#94a3b8">HTML/CSS (95%)</text>
        <text x="15" y="130" font-family="sans-serif" font-size="12" fill="#94a3b8">100% Quality Badge</text>
        <!-- Mini Progress bar -->
        <rect x="15" y="155" width="200" height="6" rx="3" fill="#1e293b" />
        <rect x="15" y="155" width="180" height="6" rx="3" fill="#8b5cf6" />
      </g>

      <!-- Card 3: Services -->
      <g transform="translate(520, 0)">
        <rect width="235" height="190" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <rect x="15" y="15" width="60" height="20" rx="10" fill="#ec4899" opacity="0.2" />
        <text x="24" y="29" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f472b6">SECTION 3</text>
        <text x="15" y="65" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">Services &amp; Work</text>
        <text x="15" y="90" font-family="sans-serif" font-size="12" fill="#94a3b8">3 Flexbox Cards</text>
        <text x="15" y="110" font-family="sans-serif" font-size="12" fill="#94a3b8">Responsive Web Dev</text>
        <text x="15" y="130" font-family="sans-serif" font-size="12" fill="#94a3b8">3 Featured Projects</text>
        <rect x="15" y="150" width="85" height="20" rx="4" fill="#334155" />
        <text x="24" y="164" font-family="sans-serif" font-size="10" fill="#cbd5e1">✓ Flexbox</text>
      </g>

      <!-- Card 4: Contact -->
      <g transform="translate(780, 0)">
        <rect width="240" height="190" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <rect x="15" y="15" width="60" height="20" rx="10" fill="#10b981" opacity="0.2" />
        <text x="24" y="29" font-family="sans-serif" font-size="10" font-weight="bold" fill="#34d399">SECTION 4</text>
        <text x="15" y="65" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">Contact &amp; Form</text>
        <text x="15" y="90" font-family="sans-serif" font-size="12" fill="#94a3b8">Interactive Inputs</text>
        <text x="15" y="110" font-family="sans-serif" font-size="12" fill="#94a3b8">Glassmorphic Toast</text>
        <text x="15" y="130" font-family="sans-serif" font-size="12" fill="#94a3b8">Email &amp; Phone Cards</text>
        <rect x="15" y="150" width="110" height="24" rx="12" fill="#10b981" />
        <text x="26" y="166" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Send Message</text>
      </g>
    </g>
  </g>
</svg>

